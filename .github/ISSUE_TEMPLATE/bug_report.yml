name: Bug report
description: Report a reproducible problem with the host or K10 firmware.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Never include API keys, tokens, Wi-Fi credentials, private tunnel URLs, audio, or personal camera footage. See SECURITY.md for private reports."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Codex CLI version, firmware environment, speech provider, and tunnel or LAN mode.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command and whether it is a saved skill or a new task.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted diagnostics
      description: Only relevant Serial messages or health fields. Remove credentials and personal data first.
      render: text
