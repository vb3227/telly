[platformio]
default_envs = unihiker

[env:unihiker]
platform = https://github.com/DFRobot/platform-unihiker.git
board = unihiker_k10
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DModel=None
    -Wl,--wrap=i2s_read
    -Wl,--wrap=esp_camera_fb_get
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
    links2004/WebSockets@2.7.3

; One-time recovery/provisioning of the vendor English wake/command model.
; Normal uploads preserve the model partition.
[env:unihiker_model_en]
extends = env:unihiker
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DModel=EN
    -Wl,--wrap=i2s_read
    -Wl,--wrap=esp_camera_fb_get
